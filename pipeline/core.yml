name: Build Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

  permissions:
  id-token: write

  jobs:

  provision:
    name: Wake up ACI instance
    runs-on: ubuntu-latest

    steps:
       - name: Login to Azure
         uses: azure/login@v3
         with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}