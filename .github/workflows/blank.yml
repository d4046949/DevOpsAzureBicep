name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:

  provision:
    name: Wake up ACI instance
    runs-on: ubuntu-latest

    steps:

       - name: Show repository ID
         shell: bash
         run: |
           echo "Repository ID: $GITHUB_REPOSITORY_ID"
         env:
           GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
  
       - name: Login to Azure
         uses: azure/login@v3
         with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

