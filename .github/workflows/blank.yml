name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:

  provision:
    name: What-if for infra
    runs-on: ubuntu-latest

    steps:
       #- name: Show repository ID
       #  shell: bash
       #  run: |
       #    echo "Repository ID: $GITHUB_REPOSITORY_ID"
       #  env:
       #    GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
       - name: Checkout repository
         uses: actions/checkout@v4
         
       - name: Login to Azure
         uses: azure/login@v3
         with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                 
       - name:  Bicep deployment What-If
         uses: azure/cli@v2
         with:
          inlineScript: |
              az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              az deployment group what-if --resource-group "${{ secrets.AZURE_CORE_RESOURCE_GROUP }}" --name "github-actions-whatif" --template-file ./infra/core/main.bicep --parameters ./infra/core/dev.bicepparam

       - name:  Bicep deployment
         uses: azure/cli@v2
         with:
          inlineScript: |
              az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              az deployment group create --resource-group "${{ secrets.AZURE_CORE_RESOURCE_GROUP }}" --name "github-actions-whatif" --template-file ./infra/core/main.bicep --parameters ./infra/core/dev.bicepparam

