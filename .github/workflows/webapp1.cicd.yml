name: WebApp1 Build & release

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'infra/app1/**'
      - 'scripts/**'
      - '.github/workflows/**'
      
  

permissions:
  contents: read

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4 

       - name: Compile and lint Bicep
         uses: azure/cli@v2
         with:
           inlineScript: |
            az bicep install
            az bicep version
            az bicep build \
              --file ./infra/app1/web-app.bicep
              
  whatif:
    name: What-if for infra
    runs-on: ubuntu-latest
    needs: lint

    environment:
      name: dev-validation

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
         
      - name: Login to Azure
        uses: azure/login@v3
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
            --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}"  \
            --template-file ./infra/app1/web-app.bicep \
            --parameters ./infra/app1/dev.bicepparam \
            > whatif.txt 2>&1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate What-If Markdown Review
        if: always()
        run: dotnet run ./scripts/GenerateWhatIfReport.cs -- whatif.txt

      - name: Debug What-If report files
        if: always()
        run: |
          echo "Working directory:"
          pwd

          echo "Generated files:"
          find . -type f \( -name "*.md" -o -name "whatif.txt" \) -print

          echo "Root directory contents:"
          ls -lah
          
      - name: Upload What-If output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-what-if-app1
          path: |
            whatif.txt
            whatif.md
          retention-days: 14
          if-no-files-found: warn


      - name: Publish What-If report to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: whatif.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- azure-what-if-report -->';
            const reportPath = process.env.REPORT_PATH;

            let report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'What-If report was not generated. Check the workflow logs.';

            const body = `${marker}
            ## Azure Infrastructure What-If

            ${report.slice(0, 55000)}

            ---
            Generated automatically by GitHub Actions.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }


      - name: Request What-If review
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha;
            const marker = `<!-- azure-what-if-review:${commitSha} -->`;
            const targetPath = 'infra/app1/web-app.bicep';

            // Avoid creating duplicate review conversations when this
            // workflow is rerun for the same commit.
            const existingComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number, per_page: 100 }
            );

            if (existingComments.some(c => c.body?.includes(marker))) {
              core.info('What-If review conversation already exists for this commit.');
              return;
            }

            // Find the first added line in the Bicep file.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const bicepFile = files.find(f => f.filename === targetPath);

            if (!bicepFile?.patch) {
              core.warning(
                `No diff available for ${targetPath}. Skipping review conversation.`
              );
              return;
            }

            function findFirstAddedLine(patch) {
              let newLineNumber = null;

              for (const line of patch.split('\n')) {
                const hunk = line.match(
                  /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/
                );

                if (hunk) {
                  newLineNumber = Number(hunk[1]);
                  continue;
                }

                if (newLineNumber === null) continue;

                if (line.startsWith('+++') || line.startsWith('---')) {
                  continue;
                }

                if (line.startsWith('+')) {
                  return newLineNumber;
                }

                if (line.startsWith('-') || line.startsWith('\\')) {
                  continue;
                }

                // Context line: advances the new-file line number.
                newLineNumber++;
              }

              return null;
            }

            const line = findFirstAddedLine(bicepFile.patch);

            if (line === null) {
              core.warning(
                `No added line found in ${targetPath}. Skipping review conversation.`
              );
              return;
            }

            const body = `${marker}
            ## Azure Infrastructure What-If review required

            Please review the **Azure Infrastructure What-If** report posted in this pull request.

            Check the proposed resource creations, modifications and deletions against the intended infrastructure changes.

            **Resolve this conversation once the What-If results have been reviewed.**

            Reviewed commit: \`${commitSha}\``;

            await github.rest.pulls.createReviewComment({
              owner,
              repo,
              pull_number,
              commit_id: commitSha,
              path: targetPath,
              line,
              side: 'RIGHT',
              body
            });

            core.info(
              `Created What-If review conversation on ${targetPath}:${line}.`
            );


  provision:
    name: deploy infa
    runs-on: ubuntu-latest
    needs: whatif
        
    if: github.ref == 'refs/heads/main'

    environment:
      name: dev

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
         
      - name: Login to Azure
        uses: azure/login@v3
        with:
         client-id: ${{ vars.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name:  Bicep deployment
        uses: azure/cli@v2
        env:
          CORE_RG: ${{ secrets.AZURE_CORE_RESOURCE_GROUP }}
        with:
          inlineScript: |
              az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              az deployment group create \
              --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}" \
              --template-file ./infra/app1/web-app.bicep \
              --parameters ./infra/app1/dev.bicepparam
              appServicePlanResourceGroup="$CORE_RG"

