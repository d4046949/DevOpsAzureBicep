name: WebApp1 Build & release

on:
  workflow_dispatch:

  #push:
    #branches: ["main"]
   # paths:
      #- 'infra/app1/**'

  #pull_request:
   # branches: ["main"]
   # paths:
    #  - 'infra/app1/**'
      
  

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4 

       - name: Compile and lint Bicep
         uses: azure/cli@v2
         with:
           inlineScript: |
            az bicep install
            az bicep version
            az bicep build \
              --file ./infra/app1/web-app.bicep
              
  provision:
    name: What-if for infra
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
         
      - name: Login to Azure
        uses: azure/login@v3
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}"  --template-file ./infra/app1/web-app.bicep --parameters ./infra/app1/dev.bicepparam

      - name:  Bicep deployment
        uses: azure/cli@v2
        env:
          CORE_RG: ${{ secrets.AZURE_CORE_RESOURCE_GROUP }}
        with:
          inlineScript: |
              az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              az deployment group create \
              --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}" \
              --template-file ./infra/app1/web-app.bicep \
              --parameters ./infra/app1/dev.bicepparam
              appServicePlanResourceGroup="$CORE_RG"

