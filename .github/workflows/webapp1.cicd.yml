name: WebApp1 Build & release

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'infra/app1/**'
      - 'scripts/**'
      - '.github/workflows/**'
      
  

permissions:
  contents: read

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4 

       - name: Compile and lint Bicep
         uses: azure/cli@v2
         with:
           inlineScript: |
            az bicep install
            az bicep version
            az bicep build \
              --file ./infra/app1/web-app.bicep
              
  whatif:
    name: What-if for infra
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
         
      - name: Login to Azure
        uses: azure/login@v3
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
            --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}"  \
            --template-file ./infra/app1/web-app.bicep \
            --parameters ./infra/app1/dev.bicepparam \

      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
            --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}"  \
            --template-file ./infra/app1/web-app.bicep \
            --parameters ./infra/app1/dev.bicepparam \
            > whatif.txt 2>&1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate What-If Markdown Review
        if: always()
        run: dotnet run ./scripts/GenerateWhatIfReport.cs -- whatif.txt

      - name: Upload What-If output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-what-if-app1
          path: whatif.txt
          retention-days: 14
          if-no-files-found: warn

  provision:
    name: deploy infa
    runs-on: ubuntu-latest
    needs: whatif
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
         
      - name: Login to Azure
        uses: azure/login@v3
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
      - name:  Bicep deployment
        uses: azure/cli@v2
        env:
          CORE_RG: ${{ secrets.AZURE_CORE_RESOURCE_GROUP }}
        with:
          inlineScript: |
              az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              az deployment group create \
              --resource-group "${{ secrets.AZURE_APP1_RESOURCE_GROUP }}" \
              --template-file ./infra/app1/web-app.bicep \
              --parameters ./infra/app1/dev.bicepparam
              appServicePlanResourceGroup="$CORE_RG"

