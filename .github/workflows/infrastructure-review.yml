
name: Infrastructure Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  infrastructure-review:
    name: Infrastructure Review
    runs-on: ubuntu-latest

    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/approve-infrastructure'

    steps:
      - name: Validate reviewer and acknowledge infrastructure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const username = context.payload.comment.user.login;

            // 1. Retrieve the pull request
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number
            });

            if (pr.state !== 'open') {
              core.setFailed('Pull request is not open.');
              return;
            }

            const headSha = pr.head.sha;

            // 2. Validate reviewer permissions
            const { data: permission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username
              });

            if (!['admin', 'write', 'maintain'].includes(permission.permission)) {
              core.setFailed(
                'Reviewer does not have sufficient repository permissions.'
              );
              return;
            }

            // 3. Confirm What-If succeeded on the latest commit
            const { data: checks } =
              await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100
              });

            const whatIfChecks = checks.check_runs
              .filter(check => check.name === 'What-if for infra')
              .sort((a, b) =>
                new Date(b.started_at || 0) -
                new Date(a.started_at || 0)
              );

            const latestWhatIf = whatIfChecks[0];

            if (!latestWhatIf ||
                latestWhatIf.status !== 'completed' ||
                latestWhatIf.conclusion !== 'success') {
              core.setFailed(
                'The latest What-If check has not succeeded for this commit.'
              );
              return;
            }

            // 4. Create an Infrastructure Review check
            // attached to the exact PR commit SHA
            const { data: reviewCheck } =
              await github.rest.checks.create({
                owner,
                repo,
                name: 'Infrastructure Review',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Infrastructure changes acknowledged',
                  summary: [
                    `Acknowledged by @${username}.`,
                    '',
                    `Commit reviewed: \`${headSha}\``,
                    '',
                    'The Azure What-If check completed successfully.',
                    '',
                    'Acknowledgement: `/approve-infrastructure`'
                  ].join('\n')
                }
              });

            core.notice(
              `Infrastructure review recorded for ${headSha}`
            );

            core.notice(
              `Check run created: ${reviewCheck.html_url}`
            );
