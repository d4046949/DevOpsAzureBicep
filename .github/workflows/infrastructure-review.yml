
name: Infrastructure Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  infrastructure-review:
    name: Infrastructure Review
    runs-on: ubuntu-latest

    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve-infrastructure')

    steps:
      - name: Validate reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.comment.user.login;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username
            });

            if (!['admin', 'write', 'maintain'].includes(permission.data.permission)) {
              core.setFailed('Reviewer does not have sufficient repository permissions.');
              return;
            }

            core.notice(`Infrastructure acknowledgement received from ${username}`);
