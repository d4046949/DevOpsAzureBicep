name: WebApp1 Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/webapp1-deploy.yml'

permissions:
  contents: read

concurrency:
  group: webapp1-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package_site:
    name: Package static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Upload website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp1-static-site
          path: src/
          if-no-files-found: error
          retention-days: 30

  deploy_dev:
    name: Dev - Deploy Static Web App
    runs-on: ubuntu-latest
    needs: package_site

    timeout-minutes: 5

    environment:
      name: dev

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp1-static-site
          path: src

      # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        id: azure_deploy
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Add deployment URL to summary
        if: success()
        env:
          SITE_URL: ${{ steps.azure_deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## DEV Deployment"
            echo ""
            echo "Website: [$SITE_URL]($SITE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        env:
          SITE_URL: ${{ steps.azure_deploy.outputs.static_web_app_url }}
        run: |
          echo "Checking website: $SITE_URL"

          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed! HTTP $HTTP_STATUS"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_STATUS. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Health check failed after 10 attempts."
          exit 1

  deploy_uat:
    name: UAT - Deploy Static Web App

    runs-on: ubuntu-latest
    needs: deploy_dev
    if: github.ref == 'refs/heads/main'

    timeout-minutes: 5

    environment:
      name: uat

    steps:
      # Checkout repository
      - name: Download website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp1-static-site
          path: src

      # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        id: azure_deploy
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Add deployment URL to summary
        if: success()
        env:
          SITE_URL: ${{ steps.azure_deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## UAT Deployment"
            echo ""
            echo "Website: [$SITE_URL]($SITE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_prod:
    name: Prod - Deploy Static Web App
    runs-on: ubuntu-latest
    needs: deploy_uat
    if: github.ref == 'refs/heads/main'

    timeout-minutes: 5

    environment:
      name: prod

    steps:
  # Checkout repository
      - name: Download website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp1-static-site
          path: src

  # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        id: azure_deploy
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Add deployment URL to summary
        if: success()
        env:
          SITE_URL: ${{ steps.azure_deploy.outputs.static_web_app_url }}
        run: |
          {
            echo "## UAT Deployment"
            echo ""
            echo "Website: [$SITE_URL]($SITE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"


  explain_skipped_deployments:
    name: Explain skipped deployments
    runs-on: ubuntu-latest
    needs: [deploy_dev, deploy_uat, deploy_prod]
    if: always() && github.ref != 'refs/heads/main'

    steps:
      - name: Explain skipped deployments
        env:
          DEV_RESULT: ${{ needs.deploy_dev.result }}
        run: |
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DEV deployment result: **${DEV_RESULT}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "UAT and PROD were skipped because this workflow was triggered from a branch other than main." >> $GITHUB_STEP_SUMMARY