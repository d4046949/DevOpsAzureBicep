name: WebApp1 Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/webapp1-deploy.yml'

permissions:
  contents: read

jobs:
  package_site:
    name: Package static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp1-static-site
          path: src/
          if-no-files-found: error
          retention-days: 30

  deploy_dev:
    name: Dev - Deploy Static Web App
    runs-on: ubuntu-latest
    needs: package_site
    timeout-minutes: 5

    environment:
      name: dev

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp1-static-site
          path: src

      # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true

  deploy_uat:
    name: UAT - Deploy Static Web App
    runs-on: ubuntu-latest
    needs: deploy_dev
    if: github.ref == 'refs/heads/main'

    timeout-minutes: 5

    environment:
      name: uat

    steps:
      # Checkout repository
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp1-static-site
          path: src

      # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true

  deploy_prod:
    name: Prod - Deploy Static Web App
    runs-on: ubuntu-latest
    needs: deploy_uat
    if: github.ref == 'refs/heads/main'

    timeout-minutes: 5
    
    environment:
      name: prod

    steps:
  # Checkout repository
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp1-static-site
          path: src

  # Deploy static content to Azure
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          api_location: ''
          output_location: ''
          skip_app_build: true