name: App1 Environment Pipeline

on:
  workflow_dispatch:

jobs:
  whatif:
    name: What-If ${{ matrix.environment }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]

    environment: ${{ matrix.environment }}-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Hello environment
        run: |
          echo "Successfully logged into Azure for ${{ matrix.environment }}"

      - name: Hello environment
        run: |
          echo "Hello from ${{ matrix.environment }}!"
          echo "What-If result for ${{ matrix.environment }}" > whatif-${{ matrix.environment }}.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: whatif-${{ matrix.environment }}
          path: whatif-${{ matrix.environment }}.txt

  publish:
    name: Publish What-If results
    runs-on: ubuntu-latest
    needs: whatif

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: whatif-*
          path: whatif-results
          merge-multiple: true

      - name: Display results
        run: |
          echo "All environments have completed!"

          for file in whatif-results/*; do
            echo "-------------------------"
            cat "$file"
          done