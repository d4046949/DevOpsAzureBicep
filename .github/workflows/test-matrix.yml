name: App1 Environment Pipeline

on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4 

       - name: Compile and lint Bicep
         uses: azure/cli@v2
         with:
           inlineScript: |
            az bicep install
            az bicep version
            az bicep build \
              --file ./infra/app1/web-app.bicep
              
  whatif:
    name: What-If ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        environment: [dev-validation, uat-validation]

    environment: ${{ matrix.environment }}-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
            --resource-group "${{ vars.AZURE_APP1_RESOURCE_GROUP }}"  \
            --template-file ./infra/app1/web-app.bicep \
            --parameters ./infra/app1/${{ matrix.environment }}.bicepparam \
   

      - name:  Bicep deployment What-If
        uses: azure/cli@v2
        with:
         inlineScript: |
            az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
            az deployment group what-if \
            --resource-group "${{ vars.AZURE_APP1_RESOURCE_GROUP }}"  \
            --template-file ./infra/app1/web-app.bicep \
            --parameters ./infra/app1/${{ matrix.environment }}.bicepparam \
            > whatif.txt 2>&1


      - name: Hello environment
        run: |
          echo "Successfully logged into Azure for ${{ matrix.environment }}"

      - name: Hello environment
        run: |
          echo "Hello from ${{ matrix.environment }}!"
          echo "What-If result for ${{ matrix.environment }}" > whatif-${{ matrix.environment }}.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: whatif-${{ matrix.environment }}
          path: whatif-${{ matrix.environment }}.txt

  publish:
    name: Publish What-If results
    runs-on: ubuntu-latest
    needs: whatif

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: whatif-*
          path: whatif-results
          merge-multiple: true

      - name: Display results
        run: |
          echo "All environments have completed!"

          for file in whatif-results/*; do
            echo "-------------------------"
            cat "$file"
          done